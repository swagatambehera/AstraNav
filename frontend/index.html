<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AstraNav | SRM AP</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <div>
    <h1>SRM AP <span>|</span> ASTRANAV</h1>
    <p>Campus pedestrian network · shortest-path explorer</p>
  </div>
</header>
<main>
  <section class="controls">
    <label>Start location<select id="source" disabled></select></label>
    <label>Destination<select id="target" disabled></select></label>
    <label>Algorithm
      <select id="algorithm">
        <option value="dijkstra">Dijkstra</option>
        <option value="bidirectional_dijkstra">Bidirectional Dijkstra</option>
      </select>
    </label>
    <button id="find" disabled>Find shortest path</button>
    <button id="reset" class="secondary">Reset</button>
  </section>
  <section class="status" id="status" role="status">Loading campus graph…</section>
  <section class="map-wrap">
    <div id="map">
      <img id="campus" src="/static/campus-map.png" alt="SRM AP campus pedestrian network map">
      <svg id="overlay" viewBox="0 0 1400 1800" preserveAspectRatio="none" aria-label="Calculated route overlay"></svg>
    </div>
  </section>
  <section class="result" id="result">
    <h2>Route details</h2>
    <p>Select a start location and destination to calculate a route.</p>
  </section>
  <p class="note">Distances use the supplied graph's illustrative kilometre weights. They are not surveyed walking distances.</p>
</main>
<script src="/static/app.js"></script>
</body>
</html>
